<!DOCTYPE html>
<html>
<head>
  <style>
    .flex-12a {
      display: flex;             
      gap: 10px;                  
      font-family: Arial, sans-serif;
    }
    .item {
      background-color: lightblue;
      text-align: center;
      border: 1px solid #333;
      padding: 10px;
    }
    .item1 {
      width: 200px;              
    }
    .item2 {
      width: 75px;               
    }
  </style>
</head>
<body>
  <div class="flex-12a">
    <div class="item item1">200px</div>
    <div class="item item2">75px</div>
  </div>
</body>
</html>
