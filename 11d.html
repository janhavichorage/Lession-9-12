<!DOCTYPE html>
<html>
<head>
  <style>
    .grid-11d {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
      gap: 20px; /* spacing between cards */
      font-family: Arial, sans-serif;
      align-items: center; /* vertically align items inside grid cells */
    }

    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .mutual {
      color: gray;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .add-btn {
      background-color: #1da1f2;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="grid-11d">
    <div class="card">
      <img src="c.png" alt="Oliver">
      <div class="name">Oliver</div>
      <div class="mutual">2 mutual friends</div>
      <button class="add-btn">Add Friend</button>
    </div>

    <div class="card">
      <img src="c2.png" alt="Mimi">
      <div class="name">Mimi</div>
      <div class="mutual">3 mutual friends</div>
      <button class="add-btn">Add Friend</button>
    </div>

    <div class="card">
      <img src="c3.png" alt="Rex">
      <div class="name">Rex</div>
      <div class="mutual">4 mutual friends</div>
      <button class="add-btn">Add Friend</button>
    </div>
  </div>
</body>
</html>
