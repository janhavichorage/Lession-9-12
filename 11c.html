<!DOCTYPE html>
<html>
<head>
  <style>
    .grid-11c {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      column-gap: 20px; 
      row-gap: 10px;    
      font-family: Arial, sans-serif;
    }
    .box {
      background-color: lightcoral;
      padding: 20px;
      text-align: center;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="grid-11c">
    <div class="box">col1</div>
    <div class="box">col2</div>
    <div class="box">col3</div>
    <div class="box">col4</div>
    <div class="box">col1</div>
    <div class="box">col2</div>
    <div class="box">col3</div>
    <div class="box">col4</div>
  </div>
</body>
</html>
