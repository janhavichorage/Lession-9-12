<!DOCTYPE html>
<html>
<head>
  <style>
    .flex-12b {
      display: flex;           
      gap: 10px;                  
      font-family: Arial, sans-serif;
    }
    .item {
      background-color: lightgreen;
      text-align: center;
      border: 1px solid #333;
      padding: 10px;
    }
    .item1 {
      width: 50px;                
    }
    .item2 {
      flex: 1;                
    }
    .item3 {
      width: 75px;                
    }
  </style>
</head>
<body>
  <div class="flex-12b">
    <div class="item item1">50px</div>
    <div class="item item2">Flexible space</div>
    <div class="item item3">75px</div>
  </div>
</body>
</html>
