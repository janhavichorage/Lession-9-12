<!DOCTYPE html>
<html>
<head>
  <title>Exercise 12g</title>
  <style>
    .profile {
      width: 400px;
      font-family: Arial;
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .profile-picture {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 15px;
    }

    .info {
      width: 200px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 3px;
    }

    .type,
    .popular {
      color: gray;
      margin-bottom: 3px;
    }

    .follow-button {
      background-color: rgb(50, 130, 230);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 9px 14px;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="profile">

    <div class="row">
      <img class="profile-picture" src="d.png">
      <div class="info">
        <div class="name">oliver</div>
        <div class="type">the cat</div>
        <div class="popular">Popular</div>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="d2.png">
      <div class="info">
        <div class="name">Mimi</div>
        <div class="type">Sleepy Cat</div>
        <div class="popular">Popular</div>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="d3.png">
      <div class="info">
        <div class="name">Rex</div>
        <div class="type">Happy Bulldog</div>
        <div class="popular">Popular</div>
      </div>
      <button class="follow-button">Follow</button>
    </div>

  </div>

</body>
</html>
