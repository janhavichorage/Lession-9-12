<!DOCTYPE html>
<html>
<head>
  <title>Exercise 12f</title>
  <style>
    .header {
      height: 50px;
      background-color: rgb(120, 82, 178);
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .home {
      color: white;
      font-family: Arial;
      font-size: 14px;
      width: 100px;
    }

    .search {
      flex: 1;
      max-width: 500px;
      border: none;
      border-radius: 20px;
      padding: 10px 15px;
      font-size: 14px;
      margin: 0 20px;
    }

    .download {
      background-color: rgb(120, 82, 178);
      color: white;
      border: 1px solid white;
      padding: 8px 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="home">Home</div>

    <input class="search" type="text" placeholder="Search">

    <button class="download">Download</button>
  </div>
</body>
</html>
